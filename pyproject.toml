[project]
name = "homeassistant-trakt"
version = "2026.10.1"
readme = "README.md"
license = "MIT"
license-files = [ "LICENSE" ]
authors = [ { name = "Joshua Peek" } ]
requires-python = ">=3.14.2"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[dependency-groups]
dev = [
    "homeassistant>=2026.10",
    "mypy>=2.4.1",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
lint.extend-select = [ "I", "UP" ]

[tool.pyproject-fmt]
indent = 4
max_supported_python = "3.15"

[tool.mypy]
strict = true
