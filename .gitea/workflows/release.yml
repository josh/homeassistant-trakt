name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-slim-amd64

    steps:
      - name: Create release
        run: |
          gt release create "$TAG" --verify-tag
        env:
          GITEA_CLI_REPO: ${{ gitea.repository }}
          GITEA_TOKEN: ${{ gitea.token }}
          TAG: ${{ gitea.ref_name }}
